[project]
name = "safeswap"
version = "0.0.1"
description = "Measure what a cost change (model swap, router, cache) costs in quality, on live traffic, with confidence intervals."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shubham Tiwari" }]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.24", "datasets>=2.19"]
embed = ["sentence-transformers>=3", "faiss-cpu>=1.8"]
plot = ["matplotlib>=3.8"]
litellm = ["litellm>=1.50"]

[project.scripts]
safeswap = "safeswap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safeswap"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
